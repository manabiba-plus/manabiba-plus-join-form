<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学年選択</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>学年を選択してください</h1>
        <select id="categorySelect">
            <option value="">-- カテゴリを選択 --</option>
            <option value="junior">中学生</option>
            <option value="high">高校生</option>
            <option value="university">大学生</option>
            <option value="worker">社会人</option>
        </select>
        <select id="gradeSelect" style="display: none;">
            <option value="">-- 学年を選択 --</option>
        </select>
        <div id="linkContainer" class="link-container"></div>
        <p id="noticeText" class="notice-text" style="display: none;">※選択にお間違いがないかご確認ください</p>
    </div>
    <script>
        const categorySelect = document.getElementById('categorySelect');
        const gradeSelect = document.getElementById('gradeSelect');
        const linkContainer = document.getElementById('linkContainer');
        const noticeText = document.getElementById('noticeText');
        
        // カテゴリごとの選択肢
        const categoryOptions = {
            'junior': [
                { value: 'j1', text: '中学1年生' },
                { value: 'j2', text: '中学2年生' },
                { value: 'j3', text: '中学3年生' }
            ],
            'high': [
                { value: 'h1', text: '高校1年生' },
                { value: 'h2', text: '高校2年生' },
                { value: 'h3', text: '高校3年生・高卒生' }
            ],
            'university': [
                { value: 'u1', text: '大学1年生' },
                { value: 'u2', text: '大学2年生' },
                { value: 'u3', text: '大学3年生' },
                { value: 'u4', text: '大学4年生' },
                { value: 'u5', text: '大学5年生(修士1年生)' },
                { value: 'u6', text: '大学6年生(修士2年生)' }
            ],
            'worker': [
                { value: 'early', text: '早朝(5:30~10:00)でご利用する方' },
                { value: 'daytime', text: '8:00~18:00の時間帯でご利用する方' },
                { value: 'fulltime', text: '5:30~23:30の時間帯でご利用する方' }
            ]
        };
        
        // 学年に対応するリンクの設定
        const gradeLinks = {
            'j1': { url: 'https://www.kaihipay.jp/forms?form_code=8616152147631042', text: '申し込みページへ' },
            'j2': { url: 'https://www.kaihipay.jp/forms?form_code=8616152147631042', text: '申し込みページへ' },
            'j3': { url: 'https://www.kaihipay.jp/forms?form_code=8616152147631042', text: '申し込みページへ' },
            'h1': { url: 'https://www.kaihipay.jp/forms?form_code=8616152147631042', text: '申し込みページへ' },
            'h2': { url: 'https://www.kaihipay.jp/forms?form_code=8616152147631042', text: '申し込みページへ' },
            'h3': { url: 'https://www.kaihipay.jp/forms?form_code=8616152147631042', text: '申し込みページへ' },
            'u1': { url: 'https://www.kaihipay.jp/forms?form_code=8616152147631042', text: '申し込みページへ' },
            'u2': { url: 'https://www.kaihipay.jp/forms?form_code=8616152147631042', text: '申し込みページへ' },
            'u3': { url: 'https://www.kaihipay.jp/forms?form_code=8616152147631042', text: '申し込みページへ' },
            'u4': { url: 'https://www.kaihipay.jp/forms?form_code=8616152147631042', text: '申し込みページへ' },
            'u5': { url: 'https://www.kaihipay.jp/forms?form_code=8616152147631042', text: '申し込みページへ' },
            'u6': { url: 'https://www.kaihipay.jp/forms?form_code=8616152147631042', text: '申し込みページへ' },
            'early': { url: 'https://www.kaihipay.jp/forms?form_code=8616152147631042', text: '申し込みページへ' },
            'daytime': { url: 'https://www.kaihipay.jp/forms?form_code=8616152147631042', text: '申し込みページへ' },
            'fulltime': { url: 'https://www.kaihipay.jp/forms?form_code=8616152147631042', text: '申し込みページへ' }
        };
        
        // カテゴリ選択時の処理
        categorySelect.addEventListener('change', function() {
            const selectedCategory = this.value;
            // 社会人の場合は「時間帯を選択」、それ以外は「学年を選択」
            const placeholderText = selectedCategory === 'worker' ? '-- 時間帯を選択 --' : '-- 学年を選択 --';
            gradeSelect.innerHTML = `<option value="">${placeholderText}</option>`;
            linkContainer.innerHTML = '';
            noticeText.style.display = 'none';
            
            if (selectedCategory && categoryOptions[selectedCategory]) {
                // サブカテゴリがある場合、2番目の選択肢を表示
                gradeSelect.style.display = 'block';
                categoryOptions[selectedCategory].forEach(option => {
                    const optionElement = document.createElement('option');
                    optionElement.value = option.value;
                    optionElement.textContent = option.text;
                    gradeSelect.appendChild(optionElement);
                });
            } else if (selectedCategory && gradeLinks[selectedCategory]) {
                // 直接リンクがある場合（社会人、時間帯オプション）
                gradeSelect.style.display = 'none';
                const link = document.createElement('a');
                link.href = gradeLinks[selectedCategory].url;
                link.textContent = gradeLinks[selectedCategory].text;
                link.className = 'grade-link';
                linkContainer.appendChild(link);
                noticeText.style.display = 'block';
            } else {
                // 選択がリセットされた場合
                gradeSelect.style.display = 'none';
            }
        });
        
        // 学年選択時の処理
        gradeSelect.addEventListener('change', function() {
            const selectedGrade = this.value;
            linkContainer.innerHTML = '';
            
            if (selectedGrade && gradeLinks[selectedGrade]) {
                const link = document.createElement('a');
                link.href = gradeLinks[selectedGrade].url;
                link.textContent = gradeLinks[selectedGrade].text;
                link.className = 'grade-link';
                linkContainer.appendChild(link);
                noticeText.style.display = 'block';
            } else {
                noticeText.style.display = 'none';
            }
        });
    </script>
</body>
</html>
